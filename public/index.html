<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat MVP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="authView" class="auth-view">
        <div class="auth-card">
          <div class="tab-row">
            <button class="tab-button active" data-tab="login">Login</button>
            <button class="tab-button" data-tab="register">Register</button>
          </div>

          <form id="loginForm" class="auth-form active">
            <h2>Welcome back</h2>
            <input type="email" id="loginEmail" placeholder="Email" required />
            <input type="password" id="loginPassword" placeholder="Password" required />
            <button type="submit">Login</button>
          </form>

          <form id="registerForm" class="auth-form">
            <h2>Create account</h2>
            <input type="text" id="registerName" placeholder="Name" required />
            <input type="email" id="registerEmail" placeholder="Email" required />
            <input type="password" id="registerPassword" placeholder="Password" required />
            <button type="submit">Register</button>
          </form>
        </div>
      </div>

      <div id="chatView" class="chat-view hidden">
        <aside class="sidebar">
          <div class="sidebar-header">
            <h2>Chats</h2>
            <button id="logoutButton" class="ghost-button">Logout</button>
          </div>

          <div class="create-group-box">
            <input id="groupName" type="text" placeholder="Group name" />
            <select id="groupMembers" multiple size="5"></select>
            <button id="createGroupButton">Create group</button>
          </div>

          <div id="conversationList" class="conversation-list"></div>
        </aside>

        <main class="chat-panel">
          <header id="chatHeader" class="chat-header"></header>

          <section id="messageList" class="message-list"></section>

          <div class="composer">
            <input id="messageInput" type="text" placeholder="Type a message..." />
            <button id="sendButton">Send</button>
          </div>
        </main>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
